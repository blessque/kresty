name: Deploy to GitHub Pages

# Builds the prototype and publishes dist/ to GitHub Pages.
#
# Requires ONE manual step, once: repo Settings → Pages → Source → "GitHub Actions".
# Without it this workflow builds green and publishes nothing.
#
# ONE branch deploys: `main`. It used to also deploy `map-plan-oblique`, and
# with parallel work going on that is a live footgun — the site is whichever
# branch pushed LAST, so a push to a branch that happens to be behind silently
# republishes an older site. `map-plan-oblique` was two merges behind `main`
# (no «Контакты») at the time this was narrowed. Everything now lands on `main`
# and the site is single-sourced. Use workflow_dispatch to publish a branch
# deliberately.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you deploy any branch by hand from the Actions tab

# The deploy job needs to mint an OIDC token to prove to Pages that it is this
# workflow; `contents: read` is enough for the checkout.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race — but the NEWEST commit is always the one that
# should be live, so a newer run supersedes an older one.
#
# This was `cancel-in-progress: false` ("let a queued deploy finish rather than
# be killed halfway"), which is sound reasoning for two healthy overlapping
# deploys and has no answer for a STRANDED one. During the 2026-08-06 Actions
# outage, run 31111489359 sat in `queued` having never been picked up by a
# runner, and because a queued run holds the group, every later deploy would
# have silently waited behind a job that was never going to start — the site
# just quietly stops updating, which is a worse failure than a superseded
# publish. Cancelling is safe here: upload and deploy are separate steps, and a
# cancelled run leaves the PREVIOUS deployment intact rather than a half-written
# site.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # bounds EXECUTION, not queue time — the concurrency setting above is what
    # actually unblocks a stranded run. This just stops a hung build from
    # sitting on the group for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `install`) — installs exactly what package-lock.json pins,
      # so CI cannot silently drift to a newer three.js than you tested against.
      - run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`, so a type error fails
      # the deploy instead of shipping a broken bundle.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # generous, because deploy-pages legitimately waits on Pages to confirm
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The 2026-08-06 run (dd33cd2) went red with "Timeout reached,
          # aborting!" — but the deployment HAD been created and the site DID
          # publish; the action simply gave up waiting for Pages to flip the
          # deployment to "succeeded". A red X on a site that actually shipped
          # is worse than a slow green one, so give the backend real room.
          # Defaults are timeout 600000 / error_count 10.
          timeout: 1800000 # 30 min
          error_count: 20
